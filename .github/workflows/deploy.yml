name: Deploy to GitHub Pages

# Builds the site and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repo: Settings → Pages → Source → "GitHub Actions".
# Until that's set, this workflow will build fine but fail at the deploy step.

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

# Grants the workflow permission to publish Pages using a short-lived token.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the newer one finish rather than
# cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Upload the built site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
